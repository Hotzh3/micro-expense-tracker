name: JTap

options:
  createIntermediateGroups: true

schemes:
  JTap:
    build:
      targets:
        JTap: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0

targets:
  JTap:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Theme
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTap
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pocket Leak
        CFBundleURLTypes:
          - CFBundleURLName: com.josema.JTap
            CFBundleURLSchemes:
              - jtap
              - pocketleak