name: JTap

options:
  createIntermediateGroups: true

schemes:
  JTap:
    build:
      targets:
        JTap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JTapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.5.0
    CURRENT_PROJECT_VERSION: 50

targets:
  JTap:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    dependencies:
      - target: PocketLeakWidget
        embed: true
      - target: PocketLeakShareExtension
        embed: true
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Theme
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTap
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: JTap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 50
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pocket Leak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.josema.JTap
            CFBundleURLSchemes:
              - jtap
              - pocketleak
        NSFaceIDUsageDescription: Pocket Leak uses Face ID or Touch ID to protect your local expense data.

  PocketLeakWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Models/WidgetSummary.swift
      - path: Services/WidgetSummaryStore.swift
      - path: Widgets/PocketLeakWidget/PocketLeakWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTap.PocketLeakWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/PocketLeakWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/PocketLeakWidget/PocketLeakWidget.entitlements
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 50
    info:
      path: Widgets/PocketLeakWidget/Info.plist
      properties:
        CFBundleDisplayName: Pocket Leak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PocketLeakShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: ShareExtension
      - path: Services/SharedTextStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTap.PocketLeakShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/PocketLeakShareExtension.entitlements
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 50
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Pocket Leak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationSupportsText: true

  JTapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests/JTapTests
    dependencies:
      - target: JTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTapTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
