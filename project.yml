name: JTap

options:
  createIntermediateGroups: true

schemes:
  JTap:
    build:
      targets:
        JTap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JTapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0

targets:
  JTap:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    dependencies:
      - target: PocketLeakWidget
        embed: true
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Theme
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTap
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: JTap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pocket Leak
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.josema.JTap
            CFBundleURLSchemes:
              - jtap
              - pocketleak

  PocketLeakWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Models/WidgetSummary.swift
      - path: Services/WidgetSummaryStore.swift
      - path: Widgets/PocketLeakWidget/PocketLeakWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTap.PocketLeakWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/PocketLeakWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/PocketLeakWidget/PocketLeakWidget.entitlements
    info:
      path: Widgets/PocketLeakWidget/Info.plist
      properties:
        CFBundleDisplayName: Pocket Leak
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  JTapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests/JTapTests
    dependencies:
      - target: JTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josema.JTapTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
